# Delivery integration test — a brand-new project pulls in this package via
# kauk and every file must land in the right position. Red here means
# consumers are broken; nothing ships until this is green.
name: delivery-integration

on:
  push:
    branches: [main, 'f/**']
  pull_request: {}
  workflow_dispatch: {}

jobs:
  install-into-fresh-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kauk (its published package)
        run: |
          # kauk is consumed as an installed artifact only — this repository
          # never reaches into kauk's repository (component boundary, operator
          # ruling 2026-08-08). kauk's own repo builds and publishes its
          # Debian package; until that package is installable, this gate is
          # honestly red.
          sudo apt-get install -y kauk 2>/dev/null || {
            echo "kauk's Debian package is not installable on this runner yet."
            echo "Upstream owns it: serialseb/kauk builds and ships its own package."
            exit 1
          }

      - name: Run delivery integration test
        run: bash tools/delivery-integration-test.sh
