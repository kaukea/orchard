# Delivery integration test — a brand-new project pulls in this package via
# kauk and every file must land in the right position. Red here means
# consumers are broken; nothing ships until this is green.
name: delivery-integration

on:
  push:
    branches: [main, 'f/**']
  pull_request: {}
  workflow_dispatch: {}

jobs:
  install-into-fresh-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint kauk read token (callabloom app)
        id: kauk-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CALLABLOOM_APP_ID }}
          private-key: ${{ secrets.CALLABLOOM_PRIVATE_KEY }}
          owner: serialseb
          repositories: kauk

      - name: Fetch kauk (private)
        run: |
          git clone --quiet --depth 1 \
            "https://x-access-token:${{ steps.kauk-token.outputs.token }}@github.com/serialseb/kauk.git" \
            "$RUNNER_TEMP/kauk"

      - name: Run delivery integration test
        run: KAUK_DIR="$RUNNER_TEMP/kauk" bash tools/delivery-integration-test.sh
