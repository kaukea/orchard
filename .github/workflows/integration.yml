# Delivery integration test — a brand-new project pulls in this package via
# kauk and every file must land in the right position. Red here means
# consumers are broken; nothing ships until this is green.
name: delivery-integration

on:
  push:
    branches: [main, 'f/**']
  pull_request: {}
  workflow_dispatch: {}

jobs:
  install-into-fresh-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kauk (Debian package from the custom apt repository)
        env:
          # These values are owned by the kauk successor's documentation —
          # its repo builds, renames and publishes the package (operator,
          # 2026-08-08). Update them from that documentation when it ships;
          # nothing here ever reaches into kauk's repository.
          APT_REPO_URL: https://packages.serialseb.net/deb
          PACKAGE: kauk
        run: |
          echo "deb [trusted=yes] $APT_REPO_URL stable main" \
            | sudo tee /etc/apt/sources.list.d/serialseb.list
          sudo apt-get update -qq || true
          sudo apt-get install -y "$PACKAGE" || {
            echo "The custom apt repository does not serve '$PACKAGE' yet."
            echo "Upstream owns publishing; this gate stays red until it ships."
            exit 1
          }

      - name: Run delivery integration test
        run: bash tools/delivery-integration-test.sh
