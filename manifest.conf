# orchids manifest v2 — what this package exposes, one typed line per entry.
# Parsed by kauk-sync (the kauk package); the engine hardcodes no layout — this
# file IS the grouping. Line types:
#   skill <name> <role>     src=skills/<name>/ → .claude/skills/<name>; role ∈
#                           dev|infra|org|all; delivery tuned per-repo in .ai.toml
#                           ([role] sections: exclude|copy|link|local, ["*"] default)
#   link <src> <dst>        absolute symlink into the clone; everyone gets it
#   template <src> <dst>    install-time copy (<project-name> substituted), then
#                           project-owned — never overwritten
#   prefix <src> <dst>      block idempotently kept at the head of dst
skill read-agents all
skill agent-behaviour all
skill git-commit all
skill handover all
skill authoring-skills org
skill gardener org
skill bloom-tasks org
skill history-rewrite org
skill workflow dev
skill workflow-complete dev
skill clean-code dev
skill readme-sync dev
skill diagnostics dev
skill coding-dotnet dev
skill coding-tofu dev
skill coding-lmstudio dev
skill software-catalog infra
skill chain-of-custody infra
skill digital-signature infra
skill forensic-acquisition infra
skill icloud infra
skill machine-access infra
skill read-apfs infra
skill reverse-engineering-files infra
skill write-to-s3 infra
